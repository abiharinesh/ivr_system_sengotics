name: ivr_frontend
description: "IVR System Sengotics - Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  dio: ^5.7.0
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.0
  google_maps_flutter_web: ^0.5.14+3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/map_markers/
    - assets/redesign/
    - assets/redesign/backgrounds/
    - assets/redesign/illustrations/
    - assets/redesign/avatars/
