services:
  # PostgreSQL Database
  - type: pserv
    name: ivr-system-db
    env: docker
    region: singapore
    plan: starter
    ipAllowList: []
    databases:
      - name: ivr_system
        user: ivr_user
    # PostGIS extension will be enabled via Prisma migrations

  # NestJS Web Service
  - type: web
    name: ivr-system-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npx prisma generate && npx nx run api-gateway:build
    startCommand: npx prisma migrate deploy && node dist/apps/api-gateway/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ivr-system-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /
